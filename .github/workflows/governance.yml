name: governance

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  governance-records:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v5
        with:
          node-version: '24.20.0'
      - name: Install the pinned governance validator
        run: python3 -m pip install --disable-pip-version-check -r scripts/governance-requirements.txt
      - name: Validate contract, requirements, conformance kit, and registry
        run: python3 scripts/check-governance.py
      - name: Execute draft conformance oracles
        run: node --test
