name: governance

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  contract-and-registry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate the standard contract and conformance registry
        run: python3 scripts/check-governance.py
